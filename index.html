<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>British Pub Quiz</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="quiz-container">
        <!-- Górny pasek z motywem -->
        <header class="quiz-header">
            <h1 class="logo">🍻 Pub Quiz</h1>
            <button id="theme-toggle" class="theme-btn" title="Toggle Theme">🌙</button>
        </header>

        <!-- EKRAN STARTOWY -->
        <div id="start-screen" class="screen active">
            <div class="welcome-box">
                <div class="difficulty-selector">
                    <p>Select Difficulty:</p>
                    <div class="diff-buttons">
                        <button class="diff-btn active" data-diff="mix">Mix 🎲</button>
                        <button class="diff-btn" data-diff="easy">Easy 🍺</button>
                        <button class="diff-btn" data-diff="medium">Medium 🍻</button>
                        <button class="diff-btn" data-diff="hard">Hard 🍻🔥</button>
                    </div>
                </div>

                <button id="start-btn" class="primary-btn">Start Quiz 🚀</button>
                <button id="leaderboard-btn" class="secondary-btn">Leaderboard 🏆</button>
            </div>
        </div>

        <!-- EKRAN QUIZU -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-info-bar">
                <span id="question-counter">Question 1/10</span>
                <span id="score-counter">0</span>
            </div>

            <div class="quiz-meta">
                <span id="category-tag" class="category-tag">🗺️ Category</span>
                <span id="beer-difficulty" class="beer-difficulty easy">🍺 Easy</span>
            </div>

            <div class="timer-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
            <div class="timer-text"><span id="timer">15s</span></div>

            <div class="question-box">
                <h3 id="question-text">Treść pytania pojawi się tutaj...</h3>
            </div>

            <div id="answers-container" class="answers-grid">
                <!-- Odpowiedzi generowane dynamicznie -->
            </div>
        </div>

        <!-- EKRAN WYNIKÓW -->
        <div id="result-screen" class="screen">
            <div class="result-box">
                <h2>Quiz Completed! 🍻</h2>
                <p id="final-score-text">Your Final Score: 0</p>
                <p id="bonus-info-text">Great job!</p>

                <div class="save-score-section">
                    <input type="text" id="player-nickname" placeholder="Enter your nickname..." maxlength="15">
                    <button id="save-score-btn" class="primary-btn">Save Score 💾</button>
                </div>

                <button id="restart-btn" class="secondary-btn">Play Again 🔄</button>
            </div>
        </div>

        <!-- EKRAN RANKINGU (LEADERBOARD) -->
        <div id="leaderboard-screen" class="screen">
            <h2>🏆 Pub Champions</h2>
            
            <!-- Przyciski filtrowania -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="mix">Mix</button>
                <button class="filter-btn" data-filter="easy">Easy</button>
                <button class="filter-btn" data-filter="medium">Med</button>
                <button class="filter-btn" data-filter="hard">Hard</button>
            </div>

            <div id="leaderboard-list" class="leaderboard-list">
                <p class="loading-text">Loading scores...</p>
            </div>
            <button id="back-to-start-btn" class="secondary-btn">Back to Menu 🏠</button>
        </div>

        <!-- DOLNY PASEK NAWIGACYJNY -->
        <nav class="bottom-nav">
            <button class="nav-btn" id="nav-home" title="Home">
                🏠
                <span>Home</span>
            </button>
            <button class="nav-btn" id="nav-leaderboard" title="Leaderboard">
                🏆
                <span>Ranking</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
