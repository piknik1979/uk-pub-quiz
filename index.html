<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UK Pub Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="app-container">
        <!-- Start Screen -->
        <section id="start-screen" class="screen active">
            <button id="theme-toggle-btn" class="theme-btn" title="Toggle Theme">🌙</button>
            <div class="pub-badge">🇬🇧 UK Pub Quiz 🍻</div>
            <h1>Test your British Wit!</h1>
            <p class="subtitle">History, pop culture, British slang, and traditional pub lore in one quiz.</p>
            <button id="start-btn" class="btn primary-btn">Start Quiz</button>
            <button id="leaderboard-btn" class="btn secondary-btn">Leaderboard</button>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="screen">
            <header class="quiz-header">
                <div class="stat-box">
                    <span class="label">Question</span>
                    <span id="question-number">1/10</span>
                </div>
                <div class="timer-box" id="timer-box">
                    <span id="timer">15</span>s
                </div>
                <div class="stat-box">
                    <span class="label">Score</span>
                    <span id="score-counter">0</span>
                </div>
            </header>

            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div class="question-card">
                <h2 id="question-text">Loading question...</h2>
            </div>

            <div class="answers-grid" id="answers-container">
                <!-- Generated by JS -->
            </div>
            
            <button id="quit-btn" class="btn text-btn" style="margin-top: 15px; background: transparent; color: var(--text-muted); border: none;">Quit to Menu</button>
        </section>

        <!-- Summary Screen -->
        <section id="summary-screen" class="screen">
            <div class="trophy-icon">🏆</div>
            <h2>Quiz Complete!</h2>
            <p class="summary-text" id="summary-message">Well played, mate!</p>
            
            <div class="score-card">
                <span class="score-label">Your Final Score</span>
                <span id="final-score" class="final-score-value">0 / 10</span>
            </div>

            <div id="save-score-container" class="save-box">
                <input type="text" id="nickname-input" placeholder="Enter your nickname..." maxlength="15">
                <button id="save-score-btn" class="btn secondary-btn">Save Score</button>
                <p id="save-status" class="save-status"></p>
            </div>

            <button id="restart-btn" class="btn primary-btn">Play Again</button>
            <button id="home-btn-summary" class="btn secondary-btn">Main Menu</button>
        </section>

        <!-- Leaderboard Screen -->
        <section id="leaderboard-screen" class="screen">
            <h2>🏆 Leaderboard</h2>
            <p class="subtitle" style="margin-bottom: 16px;">Top pub trivia champions</p>
            
            <div id="leaderboard-list" class="leaderboard-list">
                <p class="loading-scores">Loading scores...</p>
            </div>

            <button id="back-to-menu-btn" class="btn primary-btn" style="margin-top: auto;">Back to Menu</button>
        </section>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
